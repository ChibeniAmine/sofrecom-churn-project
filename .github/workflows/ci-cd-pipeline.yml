name: CI/CD Pipeline - Telco Churn Prediction

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ÉTAPE 1: TESTS AUTOMATISÉS
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black

      - name: Lint with flake8
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --statistics

      - name: Format with black
        run: black src/ --check

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/

  # ÉTAPE 2: TESTS DE DONNÉES (Data Quality)
  data-quality:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pandas numpy

      - name: Check data quality
        run: |
          python -c "
import pandas as pd
import numpy as np

# Vérifications automatiques des données
df = pd.read_csv('data/WA_Fn-UseC_-Telco-Customer-Churn.csv')

assert df.shape[0] > 0, 'Dataset vide'
assert df.shape[1] == 21, 'Nombre de colonnes incorrect'
assert df['Churn'].nunique() == 2, 'Target doit être binaire'
assert df.isnull().sum().sum() <= 11, 'Trop de valeurs manquantes'
print('✅ Tests de qualité des données passés avec succès!')
          "

  # ÉTAPE 3: TESTS DU MODÈLE
  model-testing:
    runs-on: ubuntu-latest
    needs: data-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model on small sample
        run: |
          python -c "
import pandas as pd
from src.data_preprocessing import load_and_preprocess
from src.train import train_model

# Entraînement rapide pour validation
X_train, X_test, y_train, y_test = load_and_preprocess('data/WA_Fn-UseC_-Telco-Customer-Churn.csv')
model, metrics, _ = train_model({'n_estimators': 50, 'max_depth': 3})

# Vérifier les performances minimales
assert metrics['accuracy'] > 0.75, f'Accuracy trop basse: {metrics[`accuracy`]}'
assert metrics['roc_auc'] > 0.80, f'AUC trop basse: {metrics[`roc_auc`]}'
print('✅ Tests du modèle passés avec succès!')
          "

  # ÉTAPE 4: BUILD ET PACKAGING
  build:
    runs-on: ubuntu-latest
    needs: model-testing
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          pip install build
          python -m build
          
      - name: Upload package
        uses: actions/upload-artifact@v3
        with:
          name: dist-package
          path: dist/

  # ÉTAPE 5: VERSIONING DU MODÈLE
  model-versioning:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install mlflow

      - name: Version model with MLflow
        run: |
          python -c "
import mlflow
from mlflow.tracking import MlflowClient

client = MlflowClient()

# Récupérer le meilleur run
runs = client.search_runs(
    experiment_ids=['0'],
    order_by=['metrics.accuracy DESC'],
    max_results=1
)

if runs:
    best_run = runs[0]
    model_uri = f'runs:/{best_run.info.run_id}/model'
    
    # Enregistrer le modèle dans le Model Registry
    model_name = 'telco-churn-predictor'
    mlflow.register_model(model_uri, model_name)
    
    # Passer en production si bonne performance
    if best_run.data.metrics['accuracy'] > 0.78:
        client.transition_model_version_stage(
            name=model_name,
            version=1,
            stage='Production'
        )
    print(f'✅ Modèle versionné: {model_name} v1 en production')
          "

  # ÉTAPE 6: DÉPLOIEMENT (STAGING puis PROD)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: model-versioning
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "🚀 Déploiement en environnement de staging..."
          # Ici, commandes pour déployer l'API sur Azure Functions ou AKS
          # Exemple: az functionapp deployment source config-zip ...

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "🚀 Déploiement en environnement de production..."
          # Déploiement après validation manuelle (environnement protégé)
