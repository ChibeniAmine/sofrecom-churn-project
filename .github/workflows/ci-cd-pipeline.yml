name: CI/CD Pipeline - Telco Churn Prediction

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ÉTAPE 1: TESTS AUTOMATISÉS
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 black

      - name: Lint with flake8
        run: |
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ --count --exit-zero --max-complexity=10 --statistics

      - name: Format with black
        run: black src/ --check
        
      - name: Run unit tests
        run: |
          export PYTHONPATH=.
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ÉTAPE 2: TESTS DE DONNÉES (Data Quality)
  data-quality:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pandas numpy

      - name: Check data quality
        run: |
          python -c "
          import pandas as pd
          import numpy as np
          import os
          
          data_path = 'data/WA_Fn-UseC_-Telco-Customer-Churn.csv'
          assert os.path.exists(data_path), f'Fichier non trouvé: {data_path}'
          df = pd.read_csv(data_path)
          # Tests de qualité
          assert df.shape[0] > 0, 'Dataset vide'
          assert df.shape[1] == 21, f'Nombre de colonnes incorrect: {df.shape[1]} attendu 21'
          assert df['Churn'].nunique() == 2, 'Target doit être binaire'
          # Vérifier les valeurs manquantes (après conversion)
          df['TotalCharges'] = pd.to_numeric(df['TotalCharges'], errors ='coerce')
          missing = df['TotalCharges'].isnull().sum()
          assert missing <= 11, f'Trop de valeurs manquantes: {missing}'

          print('✅ Tests de qualité des données passés avec succès!')
          "

  # ÉTAPE 3: TESTS DU MODÈLE
  model-testing:
    runs-on: ubuntu-latest
    needs: data-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model on small sample
        run: |
          export PYTHONPATH=.
          python -c "
          import pandas as pd
          import sys
          import os
          sys.path.append(os.path.abspath('.'))
          from src.data_preprocessing import load_and_preprocess
          from src.train import train_model
          # Charger les données
          data_path = 'data/WA_Fn-UseC_-Telco-Customer-Churn.csv'
          X_train, X_test, y_train, y_test = load_and_preprocess(data_path)
          # Entraînement rapide pour validation
          params = {'n_estimators': 50, 'max_depth': 3, 'learning_rate': 0.1}
          model, metrics, model_path = train_model(params)
          # Vérifier les performances minimales
          assert metrics['accuracy'] > 0.70, f'Accuracy trop basse: {metrics[\"accuracy\"]}'
          assert metrics['roc_auc'] > 0.75, f'AUC trop basse: {metrics[\"roc_auc\"]}'
          print('✅ Tests du modèle passés avec succès!')
          print(f'Accuracy: {metrics[\"accuracy\"]:.4f}, AUC: {metrics[\"roc_auc\"]:.4f}')
          "

  # ÉTAPE 4: BUILD ET PACKAGING
  build:
    runs-on: ubuntu-latest
    needs: model-testing
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          pip install build
          python -m build
          
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dist-package
          path: dist/

  # ÉTAPE 5: VERSIONING DU MODÈLE
  model-versioning:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install mlflow pandas numpy scikit-learn xgboost

      - name: Version model with MLflow
        run: |
           python -c "
           import mlflow
           from mlflow.tracking import MlflowClient
           import sys
           
              client = MlflowClient()
              print('🔍 Recherche du meilleur modèle...')
              runs = client.search_runs(
              experiment_ids=['0'],
              order_by=['metrics.accuracy DESC'],
              max_results=1 
              )   
              if not runs:
                  print('⚠️ Aucun run trouvé dans MLflow')
                  print('   Les étapes suivantes continueront sans versioning')
                  sys.exit(0) 
              best_run = runs[0]
              run_id = best_run.info.run_id
              accuracy = best_run.data.metrics.get('accuracy', 0)
              print(f'🏆 Meilleur run: {run_id}')
              print(f'📊 Accuracy: {accuracy:.4f}')
              model_uri = f'runs:/{run_id}/model'
              model_name = 'telco-churn-predictor'
              print(f'📦 Enregistrement du modèle...')
              result = mlflow.register_model(model_uri, model_name)
              print(f'✅ Modèle enregistré: {model_name} v{result.version}')
              if accuracy > 0.75:
                  client.transition_model_version_stage(
                      name=model_name,
                      version=result.version,
                      stage='Production'
                  )
            "

  # ÉTAPE 6: DÉPLOIEMENT (STAGING puis PROD)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: model-versioning
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "🚀 Déploiement en environnement de staging..."
          echo "Commande: az functionapp deployment source config-zip ..."
          # Simulé pour l'exemple

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "🚀 Déploiement en environnement de production..."
          echo "Déploiement après validation manuelle"
